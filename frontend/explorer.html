<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoWell Hub | Explorer</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container py-4">
      <header class="mb-4">
        <h1>GeoWell Hub Explorer</h1>
        <p>Search wellness retreats and community wellness places in Georgia.</p>

        <nav>
          <a href="./index.html">Home</a> |
          <a href="./explorer.html">Explorer</a> |
          <a href="./manage.html">Manage Listings</a>
        </nav>
      </header>

      <main>
        <!-- Search box -->
        <div class="mb-3">
          <label for="search-input" class="form-label">Search by wellness need</label>

          <input
            type="text"
            id="search-input"
            class="form-control"
            placeholder="Search bones, lungs, digestion, mineral water, city, kidney, region..."
          />
        </div>

        <!-- Retreat listings will display here -->
        <section id="listings"></section>
      </main>
    </div>

    <script type="module" src="./js/explorer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
