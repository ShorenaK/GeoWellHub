<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoWell Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

  <body>
    <div class="container py-4">
      <header>
        <h1>GeoWell Hub</h1>

      </header>

      <main>
 <!-- Search box -->
  <div class="mb-3">
    <label for="search-input" class="form-label">Search Retreats</label>

    <input
      type="text"
      id="search-input"
      class="form-control"
      placeholder="Search by name, city, region, or treatment type, mineral water, etc."
    />
  </div>
        
       
         <!-- Retreat listings will be displayed here -->
        <section id="listings"></section>
      </main>

        <p>Made by Shorena K. Anzhilov</p>

    </div>

    <script type="module" src="./js/frontend.js"></script>
